name: Renovate Config Validation

on:
  pull_request:
    paths:
      - '.github/renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Renovate Config (dry-run)
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug           # was input 'logLevel'
          RENOVATE_DRY_RUN: full     # was input 'dryRun' (use 'lookup' for a lighter run)
