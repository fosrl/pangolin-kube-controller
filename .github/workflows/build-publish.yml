name: Build & Publish Container

on:
  workflow_call:
    inputs:
      tag:
        description: SemVer tag (e.g. 1.4.0 or 1.4.0-rc.1)
        required: true
        type: string
      publish_latest:
        description: Also publish the 'latest' tag (ignored for pre-release)
        required: false
        default: false
        type: boolean
      publish_minor:
        description: Also publish the 'major.minor' tag (ignored for pre-release)
        required: false
        default: false
        type: boolean
    secrets:
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
    outputs:
      digest:
        description: Image digest
        value: ${{ jobs.publish.outputs.digest }}
      sbom:
        description: SBOM path
        value: ${{ jobs.publish.outputs.sbom }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write          # create GitHub release
      packages: write          # push container images
      security-events: write   # upload Trivy SARIF
      attestations: write      # build provenance attestations
      id-token: write          # OIDC for signing/attest
      artifact-metadata: write # upload artifact metadata
    outputs:
      digest: ${{ steps.run-release.outputs.digest }}
      sbom: ${{ steps.run-release.outputs.sbom }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Validate tag format
        shell: bash
        env:
          TAG_VALUE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! ${TAG_VALUE} =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag ${TAG_VALUE} is not valid SemVer" >&2
            exit 1
          fi
          echo "TAG=${TAG_VALUE}" >> "$GITHUB_ENV"

      - name: Detect pre-release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TAG}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve publish flags
        shell: bash
        env:
          INPUT_LATEST: ${{ inputs.publish_latest }}
          INPUT_MINOR: ${{ inputs.publish_minor }}
          VAR_LATEST: ${{ vars.PUBLISH_LATEST || 'false' }}
          VAR_MINOR: ${{ vars.PUBLISH_MINOR || 'false' }}
        run: |
          set -euo pipefail
          latest="$VAR_LATEST"
          minor="$VAR_MINOR"
          # Override with explicit inputs when provided via caller
          if [[ -n "${INPUT_LATEST}" ]]; then
            latest="${INPUT_LATEST}"
          fi
          if [[ -n "${INPUT_MINOR}" ]]; then
            minor="${INPUT_MINOR}"
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            latest="false"
            minor="false"
          fi
          echo "PUBLISH_LATEST=${latest}" >> "$GITHUB_ENV"
          echo "PUBLISH_MINOR=${minor}" >> "$GITHUB_ENV"

      - name: Capture build metadata timestamp
        shell: bash
        run: echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve registry image names
        shell: bash
        env:
          GHCR_IMAGE_VAR: ${{ vars.GHCR_IMAGE }}
          DOCKER_HUB_IMAGE_VAR: ${{ vars.DOCKER_HUB_IMAGE }}
          DOCKER_HUB_USER_VAR: ${{ vars.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="$GHCR_IMAGE_VAR"
          if [[ -z "$ghcr_image" ]]; then
            ghcr_image="ghcr.io/${owner_lower}/${repo_name}"
          fi
          dockerhub_image="$DOCKER_HUB_IMAGE_VAR"
          if [[ -z "$dockerhub_image" && -n "$DOCKER_HUB_USER_VAR" ]]; then
            dockerhub_image="docker.io/${DOCKER_HUB_USER_VAR}/${repo_name}"
          fi
          echo "GHCR_IMAGE=${ghcr_image,,}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${dockerhub_image,,}" >> "$GITHUB_ENV"

      - name: Show release configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Tag:        ${TAG}"
          echo "Is RC:      ${IS_PRERELEASE}"
          echo "GHCR image: ${GHCR_IMAGE}"
          echo "DockerHub:  ${DOCKERHUB_IMAGE:-<not configured>}"
          echo "Publish latest: ${PUBLISH_LATEST}"
          echo "Publish minor:  ${PUBLISH_MINOR}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go vet & tests
        run: |
          go vet ./...
          go test ./... -race -covermode=atomic
        shell: bash

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Ensure release script permissions
        run: chmod +x hack/scripts/release.sh

      - name: Run release pipeline
        id: run-release
        shell: bash
        env:
          ARTIFACT_DIR: artifacts
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          RELEASE_ENV="$RUNNER_TEMP/release.env"
          cmd=("./hack/scripts/release.sh" \
            --version "${TAG}" \
            --platforms "linux/amd64,linux/arm64" \
            --image "${GHCR_IMAGE}" \
            --sbom-path "${ARTIFACT_DIR}/sbom-${TAG}.spdx.json" \
            --trivy-format sarif \
            --trivy-output "${ARTIFACT_DIR}/trivy-${TAG}.sarif" \
            --output-file "$RELEASE_ENV")
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            cmd+=(--image "${DOCKERHUB_IMAGE}")
          fi
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            cmd+=(--publish-latest)
          fi
          if [[ "${PUBLISH_MINOR}" == "true" ]]; then
            cmd+=(--publish-minor)
          fi
          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
            cmd+=(--cosign-key env://COSIGN_PRIVATE_KEY)
          fi
          "${cmd[@]}"
          cat "$RELEASE_ENV" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              DIGEST)
                echo "digest=$value" >> "$GITHUB_OUTPUT" ;;
              PRIMARY_DIGEST_REF)
                echo "primary_ref=$value" >> "$GITHUB_OUTPUT" ;;
              SBOM_PATH)
                echo "sbom=$value" >> "$GITHUB_OUTPUT" ;;
              TRIVY_REPORT)
                echo "scan_report=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$RELEASE_ENV"

      - name: Compute image digest references
        shell: bash
        run: |
          set -euo pipefail
          echo "GHCR_REF=${GHCR_IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            echo "DOCKERHUB_REF=${DOCKERHUB_IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          fi

      - name: Attest build provenance (GHCR)
        if: env.GHCR_IMAGE != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        if: env.DOCKERHUB_REF != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Upload SBOM artifact
        if: steps.run-release.outputs.sbom != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.TAG }}
          path: ${{ steps.run-release.outputs.sbom }}

      # - name: Upload Trivy SARIF
      #   if: env.TRIVY_REPORT != ''
      #   uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
      #   with:
      #     sarif_file: ${{ env.TRIVY_REPORT }}
      #     category: container-image

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cat <<NOTES > release-notes.md
          ## Container Images
          - GHCR: ${GHCR_REF}
          - Docker Hub: ${DOCKERHUB_REF:-N/A}

          Digest: ${DIGEST}
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body_path: release-notes.md
          files: ${{ steps.run-release.outputs.sbom }}

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ inputs.tag }}
          path: artifacts
